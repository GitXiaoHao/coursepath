        isInIteration: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start-kb
      source: start
      sourceHandle: source
      target: kb
      targetHandle: target
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: code
      id: kb-cite
      source: kb
      sourceHandle: source
      target: cite
      targetHandle: target
    - data:
        isInIteration: false
        sourceType: code
        targetType: llm
      id: cite-llm_intent
      source: cite
      sourceHandle: source
      target: llm_intent
      targetHandle: target
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: llm_intent-intent_parse
      source: llm_intent
      sourceHandle: source
      target: intent_parse
      targetHandle: target
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: intent_parse-branch
      source: intent_parse
      sourceHandle: source
      target: branch
      targetHandle: target
    - data:
        isInIteration: false
