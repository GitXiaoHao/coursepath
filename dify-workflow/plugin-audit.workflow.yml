app:
  description: 安装课径学业助手插件后即可导入的聊天工作流：自动分流学分、先修与修读规划问题。
  icon: 📐
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 课径插件演示 · 学业助手
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      enabled: false
      number_limits: 3
      retrieval_model: local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
