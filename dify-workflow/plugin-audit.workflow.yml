      targetHandle: target
    nodes:
    - data:
        type: start
        title: 开始
        desc: 直接提问学分、先修或修读规划；插件按问题类型自动分流
        variables:
        - variable: completed
          label: 已修课程
          description: 逗号分隔的课程代码，可带学分如 CS101:4
          type: text-input
          required: false
          max_length: 512
          options: []
        - variable: plan_json
          label: 培养方案 JSON（可选）
          description: 留空使用内置演示方案；真实部署时由学校提供经核验的方案数据。
          type: paragraph
          required: false
          max_length: 30000
          options: []
      height: 90
      id: start
      position:
        x: 60
        y: 260
      positionAbsolute:
        x: 60
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: knowledge-retrieval
        title: 培养方案知识库检索
        query_variable_selector:
        - sys
        - query
        dataset_ids:
        - 13b4145a-882b-4bd0-a506-87d6043972a7
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 3
          score_threshold: null
          reranking_enable: false
          reranking_mode: reranking_model
          reranking_model: null
          weights: null
        metadata_filtering_mode: disabled
        vision:
          enabled: false
      height: 120
      id: kb
      position:
        x: 380
        y: 260
      positionAbsolute:
        x: 380
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        type: code
        title: 整理可核对引用
        code_language: python3
        code: "\ndef main(docs: list) -> dict:\n    if not docs:\n        return {\"\
          text\": \"> 未检索到相关培养方案条款。\"}\n    lines = [\"#### 可核对依据\"]\n    for i, doc\
          \ in enumerate(docs[:3], 1):\n        meta = doc.get(\"metadata\") or {}\n\
          \        nested = meta.get(\"doc_metadata\") or {}\n        page = nested.get(\"\
          page\") or meta.get(\"page\")\n        row = nested.get(\"table_row\") or\
          \ meta.get(\"table_row\")\n        loc = (\"第 {} 页\".format(page) if page\
          \ else \"\")\n        if row:\n            loc = \"{} 第 {} 行\".format(loc,\
          \ row) if loc else \"第 {} 行\".format(row)\n        title = doc.get(\"title\"\
          ) or nested.get(\"title\") or meta.get(\"doc_title\") or \"培养方案条款\"\n  \
          \      content = \" \".join((doc.get(\"content\") or \"\").splitlines()).strip()\n\
          \        lines.append(\"{}. {}（{}）：{}\".format(i, title, loc or \"位置未登记\"\
          , content[:160]))\n    return {\"text\": chr(10).join(lines)}\n"
        variables:
        - variable: docs
          value_selector:
          - kb
          - result
        outputs:
          text:
            type: string
            children: null
      height: 150
      id: cite
      position:
        x: 720
        y: 260
      positionAbsolute:
        x: 720
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        type: llm
        title: 千问意图识别
        desc: 仅识别应调用的工具；不计算、不补充任何课程事实。
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus-latest
          mode: chat
          completion_params:
            temperature: 0
        prompt_template:
        - role: system
          text: 你是严格的工作流路由器，只输出 JSON，不要 Markdown 或解释。intent 只能是 audit、prereq、study_plan。询问毕业还差多少学分、已修课程后剩多少学分、模块学分缺口为
            audit；询问课程先修条件、是否能选课为 prereq；询问下一步修什么、推荐课程、修读或选课规划为 study_plan。无法确定时输出
            audit。completed_courses 只能列出用户明确表示已修、修过、已通过或修完的课程代码；不要把正在询问能否选的目标课程列入，不要从课程名称猜课程代码，不要补全。格式：{\"intent\":\"audit\",\"completed_courses\":[\"CS101\"]}
        - role: user
          text: 用户问题：{{#sys.query#}}
        prompt_config:
          jinja2_variables: []
        memory: null
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        structured_output_enabled: false
        reasoning_format: separated
      height: 220
      id: llm_intent
      position:
        x: 380
        y: 220
      positionAbsolute:
        x: 380
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 320
    - data:
        type: code
        title: 校验意图
        desc: 校验千问输出；仅合并用户明确声明的已修课程，异常时保守回退。
        code_language: python3
        code: "\nimport json\nimport re\n\nPREREQ_WORDS = (\"先修\", \"前置\", \"能不能选\"\
          , \"能否选\", \"可以选\")\nPLAN_WORDS = (\"修读规划\", \"选课建议\", \"推荐课程\", \"推荐我\"\
          , \"下一步修\")\n\nCODE = re.compile(r\"(?<![A-Za-z0-9])([A-Za-z]{2,6}\\d{2,4})(?![A-Za-z0-9])\"\
          )\n\ndef codes_in(text: str) -> list:\n    return [item.upper() for item\
          \ in CODE.findall(text or \"\")]\n\ndef target_codes_in(text: str) -> set:\n\
          \    \"\"\"排除紧邻“能选/先修”等问法的目标课程代码，避免模型误把它当已修。\"\"\"\n    targets = set()\n\
          \    raw = text or \"\"\n    for match in CODE.finditer(raw):\n        #\
          \ 只看代码紧邻的短片段；不能把“VE201，VE205 能选吗”中的 VE201 误排除。\n        before = raw[max(0,\
          \ match.start() - 4):match.start()]\n        after = raw[match.end():match.end()\
          \ + 4]\n        if any(word in before or word in after for word in (\"能选\"\
          , \"选吗\", \"先修\", \"前置\")):\n            targets.add(match.group(1).upper())\n\
          \    return targets\n\ndef main(model_text: str, query: str, form_completed:\
          \ str) -> dict:\n    raw = model_text or \"\"\n    match = re.search(r\"\
          \\{.*?\\}\", raw, re.S)\n    data = {}\n    if match:\n        try:\n  \
          \          data = json.loads(match.group(0))\n        except (TypeError,\
          \ ValueError):\n            data = {}\n    intent = str(data.get(\"intent\"\
          ) or \"\").lower()\n    if intent not in (\"audit\", \"prereq\", \"study_plan\"\
          ):\n        text = query or \"\"\n        if any(word in text for word in\
          \ PREREQ_WORDS):\n            intent = \"prereq\"\n        elif any(word\
          \ in text for word in PLAN_WORDS):\n            intent = \"study_plan\"\n\
          \        else:\n            intent = \"audit\"\n    # 表单是用户显式录入，优先保留。模型提取的课程必须同时：格式合法、原文出现、\n\
          \    # 且用户这轮确实使用了完成状态表述；不从课程名称或常识推断代码。\n    completed = codes_in(form_completed)\n\
          \    completion_claimed = any(word in (query or \"\") for word in (\"已修\"\
          , \"修过\", \"学过\", \"已通过\", \"通过了\", \"已完成\", \"修完\"))\n    model_courses\
          \ = data.get(\"completed_courses\") or []\n    if isinstance(model_courses,\
          \ str):\n        model_courses = codes_in(model_courses)\n    query_codes\
          \ = set(codes_in(query))\n    target_codes = target_codes_in(query)\n  \
          \  if completion_claimed and isinstance(model_courses, list):\n        for\
          \ item in model_courses:\n            code = str(item).upper().strip()\n\
          \            if re.fullmatch(r\"[A-Z]{2,6}\\d{2,4}\", code) and code in\
          \ query_codes and code not in target_codes:\n                completed.append(code)\n\
          \    return {\"intent\": intent, \"completed\": \",\".join(dict.fromkeys(completed))}\n"
        variables:
        - variable: model_text
          value_selector:
          - llm_intent
          - text
        - variable: query
          value_selector:
          - sys
          - query
        - variable: form_completed
          value_selector:
          - start
          - completed
        outputs:
          intent:
            type: string
            children: null
          completed:
            type: string
            children: null
      height: 150
      id: intent_parse
      position:
        x: 760
        y: 250
      positionAbsolute:
        x: 760
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        type: if-else
        title: 按意图分流（千问 + 校验）
        logical_operator: or
        cases:
        - case_id: prereq
