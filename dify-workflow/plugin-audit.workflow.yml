app:
  description: 只用 .difypkg 插件完成学分缺口核算，用于验证插件可独立工作。
  icon: 📐
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 课径插件演示 · 学分缺口核算
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      enabled: false
      number_limits: 3
      retrieval_model: local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: tool
      id: start-tool
      source: start
      sourceHandle: source
      target: tool
      targetHandle: target
    - data:
        isInIteration: false
        sourceType: tool
        targetType: answer
      id: tool-answer
      source: tool
      sourceHandle: source
      target: answer
      targetHandle: target
    nodes:
    - data:
        type: start
        title: 开始
        desc: 输入已修课程，插件直接算出学分缺口
        variables:
        - variable: completed
          label: 已修课程
          description: 逗号分隔的课程代码，可带学分如 CS101:4
          type: text-input
          required: false
          max_length: 512
          options: []
      height: 90
      id: start
      position:
        x: 60
        y: 260
      positionAbsolute:
        x: 60
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: tool
        title: 学分缺口核算（插件）
        desc: 调用本地 .difypkg 插件，内核随插件分发，不依赖外部服务
        provider_id: coursepath/course_audit/course_audit
        provider_type: plugin
        provider_name: coursepath/course_audit/course_audit
        tool_name: credit_audit
        tool_label: Credit gap audit
        tool_configurations: {}
        tool_parameters:
          completed:
            type: mixed
            value: '{{#start.completed#}}'
          plan_json:
            type: mixed
            value: ''
        tool_node_version: '2'
        plugin_unique_identifier: coursepath/course_audit:0.1.1@2da1f4656136caf97169bfbae3c798f4fc33d4cb4f72a720df861cb16173bc5e
      height: 90
      id: tool
      position:
        x: 400
        y: 260
      positionAbsolute:
        x: 400
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: answer
        title: 回答
        desc: ''
        answer: '{{#tool.text#}}'
        variables: []
      height: 90
      id: answer
      position:
        x: 760
        y: 260
      positionAbsolute:
        x: 760
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
