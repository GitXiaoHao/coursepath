app:
  description: 「课径」：把培养方案条款变成可核算的问答，每题都给引用与计算过程。
  icon: 📘
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: 课径 · 可核算的培养方案问答 v8（精简回复版）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_size: 15
      enabled: false
    opening_statement: '你好，我是「课径」。可以问我：

      1. 我修完这些课还差多少学分？（先在下方填已修课程代码，如 GE101,ME101）

      2. 汽车电子控制的先修要求是什么？我能选吗？

      每条回答都会给出依据条款与计算步骤。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 毕业还差多少学分？
    - 汽车电子控制的先修要求是什么？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
