    - data:
        desc: ''
        selected: false
        type: code
        title: 校验意图与已修课程
        code_language: python3
        code: "\nimport json\nimport re\n\nAUDIT_WORDS = (\"毕业\", \"还差\", \"缺多少\"\
          , \"学分缺口\", \"已修学分\", \"总学分\", \"完成学分\", \"修完\", \"已修\", \"学过\", \"通过\"\
          )\nPREREQ_WORDS = (\"先修\", \"前置\", \"能不能选\", \"可以选\", \"能否选\")\n\ndef main(model_text:\
          \ str, query: str, form_completed: str) -> dict:\n    raw = model_text or\
          \ \"\"\n    # 支持模型偶尔包裹在 Markdown code fence 里的 JSON。\n    match = re.search(r\"\
          \\{.*?\\}\", raw, re.S)\n    data = {}\n    if match:\n        try:\n  \
          \          data = json.loads(match.group(0))\n        except (TypeError,\
          \ ValueError):\n            data = {}\n\n    intent = str(data.get(\"intent\"\
          ) or \"\").lower()\n    text = query or \"\"\n    if intent not in (\"audit\"\
          , \"prereq\", \"clause\"):\n        if any(word in text for word in PREREQ_WORDS):\n\
          \            intent = \"prereq\"\n        elif any(word in text for word\
          \ in AUDIT_WORDS):\n            intent = \"audit\"\n        else:\n    \
          \        intent = \"clause\"\n\n    # 只接受规范课程代码；表单输入优先保留，模型抽取的代码补充到其后。\n\
          \    found = re.findall(r\"\\b[A-Za-z]{2,6}\\d{2,4}\\b\", form_completed\
          \ or \"\")\n    model_courses = data.get(\"completed_courses\") or []\n\
          \    if isinstance(model_courses, str):\n        model_courses = re.findall(r\"\
          \\b[A-Za-z]{2,6}\\d{2,4}\\b\", model_courses)\n    if isinstance(model_courses,\
          \ list):\n        for course in model_courses:\n            value = str(course).upper().strip()\n\
          \            if re.fullmatch(r\"[A-Z]{2,6}\\d{2,4}\", value):\n        \
          \        found.append(value)\n    completed = \",\".join(dict.fromkeys(code.upper()\
          \ for code in found))\n    return {\"intent\": intent, \"completed\": completed}\n"
        variables:
        - variable: model_text
          value_selector:
          - llm_intent
          - text
        - variable: query
          value_selector:
          - sys
          - query
        - variable: form_completed
          value_selector:
          - start
          - completed
        outputs:
          intent:
            type: string
            children: null
          completed:
            type: string
            children: null
